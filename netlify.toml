# Netlify Configuration for Prodigy Amp (https://prodigy-amp.netlify.app)
# 1. Proxies Google Drive audio downloads on the same origin (/drive-audio/*)
# 2. Enforces production security headers (CSP, X-Frame-Options, COOP, Referrer-Policy)
# 3. Restricts /drive-audio/* to same-origin (no wildcard CORS) per SEC-H5, SEC-M1, SEC-L6

[build]
  publish = "."

[[redirects]]
  from = "/drive-audio/*"
  to = "https://drive.usercontent.google.com/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://script.google.com https://script.googleusercontent.com https://drive.usercontent.google.com https://api.allorigins.win https://api.codetabs.com; frame-ancestors 'none';"

[[headers]]
  for = "/drive-audio/*"
  [headers.values]
    Cross-Origin-Resource-Policy = "same-origin"
